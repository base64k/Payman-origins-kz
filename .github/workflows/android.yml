# Builds the Android app (launcher + Kazakh/English/Portuguese resources) as a
# debug APK and uploads it as a workflow artifact.
#
# What this does NOT build: the native game library (librayman.so) and the
# ReXGlue runtime. Those are generated from the player's own copy of the game,
# which must never be put in CI, so they are built locally with
# android/build_apk.sh (see docs/ANDROID.md). The APK from this workflow
# therefore shows the launcher, but cannot start the game by itself.

name: Android APK

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - "rex/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "rex/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Ubuntu runner image ships the Android SDK in $ANDROID_HOME; add the
      # components the build needs (platform 35, build-tools 35, NDK 28.2.13676358).
      - name: Install SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the APK contains the Kazakh resources
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump resources "$APK" > resources.txt
          # The compiled resource table has a Kazakh configuration and the launcher strings.
          grep -q "config kk" resources.txt
          grep -q "menu_play" resources.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rayman-launcher-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
